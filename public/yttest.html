<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Video Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
    /* ML Tube Page CSS - Neon Cyan Theme */
    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
        }

        :root {
            --primary-neon: #0ff;
            --primary-glow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 30px #0ff, 0 0 40px #0ff;
            --secondary-neon: #f0f;
            --tertiary-neon: #0f0;
            --background-dark: #000;
            --background-light: #111;
            --text-light: #fff;
            --text-dark: #333;
            --gradient-bg: linear-gradient(45deg, #000, #111, #000);
        }

        body {
            background: var(--gradient-bg);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navbar */
    /* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px; /* Increased padding */
    background-color: black;
    border-bottom: 2px solid cyan;
    height: 80px; /* Increased height */
}

/* Navbar content container */
.navbar-content {
    display: flex;
    align-items: center;
    width: 100%;
}

/* Title */
.navbar h1 {
    font-size: 1.8rem; /* Slightly larger */
    color: cyan;
    font-family: 'Orbitron', sans-serif;
}

/* Navigation container */
.nav-container {
    display: flex;
    align-items: center;
    margin-left: auto;
    gap: 30px; /* Increased spacing */
}

/* Navigation links */
.nav-links {
    display: flex;
    gap: 25px; /* Increased spacing */
}

.nav-links a {
    text-decoration: none;
    color: cyan;
    font-weight: bold;
    font-size: 1.1rem; /* Increased font size */
    font-family: 'Rajdhani', sans-serif;
}

/* User Profile Section */
.user-info {
    font-size: 1.1rem;
    color: cyan;
    display: flex;
    align-items: center;
    gap: 12px; /* Increased spacing */
}

.user-info i {
    font-size: 1.4rem; /* Slightly larger */
}

  

        /* Main Content */
        .main-content {
            width: 90%;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 2rem 0;
        }

        /* Hero Section */
        .hero {
            padding: 4rem 2rem;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 3rem;
            background: rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: var(--text-light);
            text-shadow: 0 0 10px var(--primary-neon), 0 0 20px var(--primary-neon);
        }

        .search-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--primary-neon);
            border-radius: 30px;
            padding: 0.8rem 1.5rem;
            color: var(--text-light);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            box-shadow: 0 0 15px var(--primary-neon);
        }

        .button {
            background: transparent;
            color: var(--primary-neon);
            padding: 0.8rem 2rem;
            text-decoration: none;
            font-size: 1.1rem;
            border: 2px solid var(--primary-neon);
            border-radius: 30px;
            box-shadow: 0 0 10px var(--primary-neon);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .button:hover {
            background: var(--primary-neon);
            color: var(--background-dark);
            box-shadow: 0 0 20px var(--primary-neon);
            transform: translateY(-3px);
        }

        /* Video Grid */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .feature-card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 10px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
          <h1><i class="fas fa-brain"></i> Neural Network</h1>
          <div class="nav-container">
            <div class="nav-links">
              <a href="./discussions.html"><i class="fas fa-users"></i> Discussions</a>
              <a href="./news.html"><i class="fas fa-book"></i> News</a>
              <a href="./yttest.html"><i class="fas fa-video"></i> ML Tube</a>
            </div>
            <div class="user-info">
              <i class="fas fa-user-circle"></i> <span id="username">Guest</span>
            </div>
          </div>
        </div>
      </nav>

    <div class="main-content">
        <div class="hero">
            <h1>Explore ML Videos</h1>
            <p>Find top machine learning tutorials, guides, and resources.</p>
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchQuery" 
                    placeholder="Search for ML videos" 
                    class="search-input"
                >
                <button class="button">Search</button>
            </div>
        </div>

        <div id="videoContainer" class="features-grid"></div>
    </div>

    <script>
        window.onload = () => {
            fetchVideos('Machine Learning tutorials'); // Default search on page load
        };

        async function fetchVideos(query = 'Machine Learning tutorials') {
            const apiKey = 'AIzaSyBAwYZKq6YUlOhjr9Pa1Wow-znanw4jkIo'; // Replace with your API Key
            const apiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${query}&key=${apiKey}&type=video&maxResults=5`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                const videoContainer = document.getElementById('videoContainer');
                videoContainer.innerHTML = '';

                data.items.forEach(item => {
                    const videoId = item.id.videoId;
                    const title = item.snippet.title;
                    const videoElement = `
                        <div class="feature-card">
                            <h3>${title}</h3>
                            <iframe 
                                width="100%" 
                                height="215"
                                src="https://www.youtube.com/embed/${videoId}" 
                                frameborder="0" 
                                allowfullscreen
                            ></iframe>
                        </div>`;
                    videoContainer.innerHTML += videoElement;
                });

            } catch (error) {
                console.error('Error fetching videos:', error);
                alert('Failed to fetch videos.');
            }
        }

        document.querySelector('.button').addEventListener('click', () => {
            const query = document.getElementById('searchQuery').value || 'Machine Learning tutorials';
            fetchVideos(query);
        });
        async function fetchUserSession() {
        try {
            const response = await fetch("/api/session", { method: "GET", credentials: "include" });
            const data = await response.json();

            if (data.username) {
                document.getElementById("username").innerText = data.username;
            }
        } catch (error) {
            console.error("Error fetching session:", error);
        }
    }

    fetchUserSession();
    </script>
</body>
</html>
